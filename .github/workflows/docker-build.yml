name: Build Docker image on push

on:
  push:
    branches:
      - "develop"

jobs:
  build:
    name: Build and publish S13 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: devopseasylearning
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            devopseasylearning/s13-training-camps:${{ github.sha }}
            devopseasylearning/s13-training-camps:latest

      - name: Show published image
        env:
          IMAGE: devopseasylearning/s13-training-camps
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published Docker image"
            echo '```'
            echo "$IMAGE:latest"
            echo "$IMAGE:$GITHUB_SHA"
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
